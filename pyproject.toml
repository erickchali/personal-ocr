[project]
name = "personal-ocr"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.3.18",
    "langchain-openrouter>=0.2.8",
    "dotenv>=0.9.9",
    "ipykernel>=7.1.0",
    "langchain-model-profiles>=0.0.4",
    "langchain-tavily>=0.2.13",
    "tavily-python>=0.7.13",
    "tavily>=1.1.0",
    "langchain-community>=0.4.2",
    "pypdf>=6.2.0",
    "langchain-text-splitters>=1.0.0",
    "mcp>=1.21.1",
    "langchain-mcp-adapters>=0.1.13",
    "langgraph>=1.2.11",
    "langgraph-cli>=0.4.9",
    "langgraph-api>=0.7.99",
    "ipywidgets>=8.1.8",
    "sounddevice>=0.5.3",
    "scipy>=1.16.3",
    "langsmith==0.7.23",
    "langchain-core>=1.6.1",
    "jupyterlab>=4.5.1",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "sqlalchemy>=2.0.45",
    "psycopg2-binary>=2.9.11",
    "alembic>=1.18.4",
    "boto3>=1.43.85",
    "pydantic-settings>=2.12.0",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "api*", "config*", "db*", "domain*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
